<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NDA Playbook</title>
  <link rel="stylesheet" href="playbook-page.css">
</head>
<body>

<header class="pb-header">
  <div class="pb-header-left">
    <a href="/" class="pb-back-link">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>
      Doc Review
    </a>
    <div class="pb-header-sep"></div>
    <svg class="pb-header-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
    <h1 class="pb-header-title">NDA Playbook</h1>
  </div>
  <div class="pb-header-right">
    <span class="pb-save-status" id="save-status"></span>
    <button class="pb-btn pb-btn-primary" id="save-btn">Save changes</button>
  </div>
</header>

<div class="pb-tabs-bar">
  <button class="pb-tab active" data-tab="clauses">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
    Clauses
  </button>
  <button class="pb-tab" data-tab="trees">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
    Decision Trees
  </button>
</div>

<!-- ── Clauses tab ── -->
<div class="pb-tab-panel active" data-panel="clauses">
  <div class="pb-clauses-layout">

    <!-- Left: sections + clauses -->
    <div class="pb-clauses-main">
      <div class="pb-page">
        <div id="sections-container"></div>
        <button class="pb-add-section-btn" id="add-section-btn">+ Add section</button>
      </div>
    </div>

    <!-- Right: per-clause library sidebar -->
    <div class="pb-clause-sidebar" id="clause-sidebar">
      <div class="pb-sidebar-empty">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#d1d5db" stroke-width="1.5"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
        <p>Click a clause to view and edit its pre-approved language, email templates, and standard responses.</p>
      </div>
    </div>

  </div>
</div>

<!-- ── Decision Trees tab ── -->
<div class="pb-tab-panel" data-panel="trees">
  <div class="pb-page">
    <div id="trees-panel"></div>
  </div>
</div>

<script src="playbook-page.js"></script>
</body>
</html>
