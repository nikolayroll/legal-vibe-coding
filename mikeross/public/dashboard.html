<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Doc Review</title>
  <link rel="stylesheet" href="dashboard.css">
</head>
<body>

<header class="dash-header">
  <div class="dash-header-left">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#60a5fa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
      <polyline points="14 2 14 8 20 8"/>
      <line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/>
    </svg>
    <span class="dash-logo">Doc Review</span>
  </div>
  <nav class="dash-nav">
    <a href="/playbook" class="dash-nav-link">Playbook</a>
    <a href="/reviews" class="dash-nav-link">Reviews</a>
  </nav>
</header>

<main class="dash-main">

  <!-- Upload -->
  <section class="dash-upload-section">
    <div class="dash-upload-zone" id="dash-drop-zone">
      <div class="dash-upload-icon">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#9ca3af" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <polyline points="14 2 14 8 20 8"/>
          <line x1="12" y1="18" x2="12" y2="12"/>
          <line x1="9" y1="15" x2="15" y2="15"/>
        </svg>
      </div>
      <p class="dash-upload-title">Drop a .docx file to start reviewing</p>
      <p class="dash-upload-hint">or <span class="dash-upload-browse">click to browse</span></p>
      <input type="file" id="dash-file-input" accept=".docx">
    </div>
    <div id="dash-upload-progress" class="dash-upload-progress hidden">
      <div class="dash-spinner"></div>
      <span>Parsing document…</span>
    </div>
  </section>

  <!-- Playbooks -->
  <section class="dash-playbooks-section">
    <div class="dash-section-header">
      <h2 class="dash-section-title">Playbooks</h2>
    </div>
    <div class="dash-playbook-list">
      <a href="/playbook" class="dash-playbook-row">
        <div class="dash-playbook-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/>
            <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
          </svg>
        </div>
        <div class="dash-playbook-info">
          <div class="dash-playbook-name">NDA Playbook</div>
          <div class="dash-playbook-desc">Non-disclosure agreement review rules, escalation triggers, and fallback positions</div>
        </div>
        <svg class="dash-playbook-arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg>
      </a>
    </div>
  </section>

  <!-- Recent documents -->
  <section class="dash-docs-section">
    <div class="dash-section-header">
      <h2 class="dash-section-title">Recent documents</h2>
    </div>
    <div class="dash-doc-list" id="dash-doc-list">
      <div class="dash-list-loading">Loading…</div>
    </div>
  </section>

</main>

<script src="dashboard.js"></script>
</body>
</html>
